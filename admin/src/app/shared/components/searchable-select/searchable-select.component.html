<div class="searchable-select position-relative">

  <div class="input-group input-group-sm">
    <input type="text"
           class="form-control"
           [placeholder]="placeholder"
           [(ngModel)]="searchTerm"
           (focus)="onInputFocus()"
           (input)="onInputInput()"
           (blur)="onBlur()"
           autocomplete="off">
    <span class="input-group-text bg-body">
      <span *ngIf="creating" class="spinner-border spinner-border-sm text-muted"></span>
      <i *ngIf="!creating && selectedId"  class="bi bi-check-lg text-success"></i>
      <i *ngIf="!creating && !selectedId" class="bi bi-search text-muted" style="font-size:.75rem"></i>
    </span>
  </div>

  <div *ngIf="open"
       class="searchable-dropdown border rounded bg-body shadow-sm position-absolute w-100 mt-1"
       style="z-index:1055; max-height:220px; overflow-y:auto">

    <button *ngFor="let item of filtered"
            type="button"
            class="dropdown-item py-2 px-3 small"
            [class.active]="item.id === selectedId"
            (mousedown)="select(item)">
      {{ item.name }}
    </button>

    <div *ngIf="!filtered.length && !showCreate" class="px-3 py-2 text-muted small">
      Sin resultados.
    </div>

    <button *ngIf="showCreate"
            type="button"
            class="dropdown-item py-2 px-3 small text-primary fw-semibold border-top"
            (mousedown)="requestCreate()">
      <i class="bi bi-plus-circle me-1"></i>Crear «{{ searchTerm.trim() }}»
    </button>

  </div>
</div>
